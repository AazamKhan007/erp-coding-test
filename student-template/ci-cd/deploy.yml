# Question 4: CI/CD & GitHub Actions
# Automated testing and building workflow

name: CI/CD

# Run the workflow whenever code is pushed to the main branch.
on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Get the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js for the frontend.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install frontend dependencies.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # Build the frontend.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Set up Python for the backend.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Python dependencies.
      - name: Install backend dependencies
        working-directory: backend/python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Run Python tests.
      - name: Run backend tests
        working-directory: backend/python
        run: python -m pytest
